name: Daily Retail BI & Model Drift Telemetry

on:
  schedule:
    # Runs everyday at 03:30 UTC (09:00 AM IST)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  retail-bi-audit:
    name: Execute Daily Retail Analytics Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Retail BI Audit
        id: run_audit
        run: |
          COMMIT_MSG=$(python scripts/daily_retail_bi_audit.py)
          echo "commit_msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: Commit and Push Daily Audit Ledger
        run: |
          git config user.name "Dhruv Jain"
          git config user.email "jaindhruv1923@gmail.com"
          git add docs/DAILY_RETAIL_BI_AUDIT.md docs/telemetry_ledger.json
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit"
          else
            git commit -m "${{ steps.run_audit.outputs.commit_msg }}"
            git push origin main
          fi
